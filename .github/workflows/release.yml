name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target.os }}/${{ matrix.target.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: linux,   arch: amd64 }
          - { os: linux,   arch: arm64 }
          - { os: windows, arch: amd64 }
          - { os: windows, arch: arm64 }
          - { os: darwin,  arch: amd64 }
          - { os: darwin,  arch: arm64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          mkdir -p backend/internal/webui/static
          cp -r frontend/dist/. backend/internal/webui/static/

      - name: Build (Linux)
        if: matrix.target.os == 'linux'
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p ../dist
          for bin in server client; do
            go build \
              -trimpath \
              -ldflags="-s -w" \
              -o ../dist/${bin} \
              ./cmd/${bin}
          done

      - name: Build (Windows)
        if: matrix.target.os == 'windows'
        working-directory: backend
        env:
          GOOS: windows
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p ../dist
          for bin in server client; do
            go build \
              -trimpath \
              -ldflags="-s -w" \
              -o ../dist/${bin}.exe \
              ./cmd/${bin}
          done

      - name: Build (macOS)
        if: matrix.target.os == 'darwin'
        working-directory: backend
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p ../dist
          for bin in server client; do
            go build \
              -trimpath \
              -ldflags="-s -w" \
              -o ../dist/${bin} \
              ./cmd/${bin}
          done

      - name: Upload raw binaries
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build GSC_CLIENT_DIR layout
        run: |
          mkdir -p client-binaries release-assets
          # bin-<os>-<arch> artifacts contain raw server/client binaries at the root.
          for target in linux-amd64 linux-arm64 windows-amd64 windows-arm64 darwin-amd64 darwin-arm64; do
            d="artifacts/bin-${target}"
            test -d "$d" || { echo "missing artifact: $d" >&2; exit 1; }
            os="${target%%-*}"
            arch="${target##*-}"
            out="client-binaries/${os}-${arch}"
            mkdir -p "$out"
            if [ "$os" = windows ]; then
              cp "$d/client.exe" "$out/client.exe"
              cp "$d/server.exe" "release-assets/gosocode-server-${target}.exe"
              test -f "$out/client.exe" || { echo "missing Windows client for $target" >&2; exit 1; }
            else
              cp "$d/client" "$out/client"
              cp "$d/server" "release-assets/gosocode-server-${target}"
              test -f "$out/client" || { echo "missing client for $target" >&2; exit 1; }
            fi
          done
          find client-binaries -type f | sort
          tar -czf "gosocode-client-binaries-latest.tar.gz" -C client-binaries .
          tar -tzf "gosocode-client-binaries-latest.tar.gz" | sort
          mv "gosocode-client-binaries-latest.tar.gz" release-assets/
          ls -lh release-assets/

      - name: Update latest tag
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest build
          generate_release_notes: true
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: release-assets/*
